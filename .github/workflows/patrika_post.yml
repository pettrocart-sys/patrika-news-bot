name: Patrika Local News Poster (Every 3 Hours)

on:
  schedule:
    # Har 3 ghante mein chalega
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  post-patrika-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai feedparser google-api-python-client google-auth-oauthlib google-auth requests

      - name: Run Script with Auto-Retry
        uses: nick-fields/retry@v2
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 30
          command: python patrika_poster.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TOKEN_JSON: ${{ secrets.TOKEN_JSON }}
